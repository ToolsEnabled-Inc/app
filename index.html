<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Control</title>
  <!-- the favicon is the palette at 16px: the coordinator's ring around the
       shadow manager's core. Hexes are --c-coordinator / --c-shadow and move
       with them (see the role palette block in src/styles.css). The ring
       thickened 9 -> 10 and the core grew 12 -> 13 because the deeper hues
       are read at a tab's scale as area, not as line. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='none' stroke='%23008dab' stroke-width='10'/><circle cx='50' cy='50' r='13' fill='%2300956c'/></svg>" />
  <!-- theme before first paint: /src/main.js is a module (deferred), so
       reading the stored theme there alone flashed the white page at every
       tan/black user. Same key and same guarded read as main.js. -->
  <script>
    try {
      var t = localStorage.getItem('mc.theme')
      document.documentElement.dataset.theme = (t === 'tan' || t === 'black') ? t : 'white'
    } catch (e) { document.documentElement.dataset.theme = 'white' }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="tb-side tb-left">
      <button class="icon-btn" id="nav-back" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="tb-side tb-right">
      <span class="tb-settings-label" aria-hidden="true">settings</span>
      <button class="icon-btn" id="open-settings" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="drawer">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.6a1.7 1.7 0 0 1 .34 1.87l-.55 1.28a1.7 1.7 0 0 1-1.63 1.03l-1.16-.05a6.6 6.6 0 0 1-1.11.65l-.38 1.1a1.7 1.7 0 0 1-1.6 1.14h-1.4a1.7 1.7 0 0 1-1.6-1.14l-.38-1.1a6.6 6.6 0 0 1-1.1-.65l-1.17.05a1.7 1.7 0 0 1-1.63-1.03l-.55-1.28a1.7 1.7 0 0 1 .34-1.87l.79-.85a6.7 6.7 0 0 1 0-1.5l-.79-.85a1.7 1.7 0 0 1-.34-1.87l.55-1.28A1.7 1.7 0 0 1 6.1 5.42l1.16.05a6.6 6.6 0 0 1 1.11-.65l.38-1.1A1.7 1.7 0 0 1 10.35 2.6h1.4a1.7 1.7 0 0 1 1.6 1.13l.38 1.1c.39.18.76.4 1.1.65l1.17-.05a1.7 1.7 0 0 1 1.63 1.03l.55 1.28a1.7 1.7 0 0 1-.34 1.87l-.79.85a6.7 6.7 0 0 1 0 1.5l.79.85Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="nav-next" title="Next" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="stage"></main>

  <!-- settings drawer (slides in, never a popup). It covers the page while
       open, so it is a modal dialog to assistive tech as well as visually —
       main.js parks the header and the stage behind it with `inert` and moves
       focus in, otherwise reaching the drawer took 16 Tab presses through
       controls the drawer itself was covering (WCAG 2.2 SC 2.4.11). -->
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Settings" aria-hidden="true">
    <div class="drawer-head">
      <span>Settings</span>
      <button class="icon-btn" id="close-settings" aria-label="Close settings">
        <svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <div class="set-row">
        <span class="set-label">Theme</span>
        <div class="theme-seg" id="theme-seg" role="group" aria-label="Theme">
          <button type="button" data-theme="white">White</button>
          <button type="button" data-theme="tan">Tan</button>
          <button type="button" data-theme="black">Black</button>
        </div>
      </div>
      <!-- same control family as Theme on purpose: one drawer, one control
           language. Scales the whole app via zoom (the codebase is sized in
           px throughout; zoom rescales layout coherently and every
           ResizeObserver-driven chart re-fits itself on the change). -->
      <div class="set-row">
        <span class="set-label">Text size</span>
        <div class="theme-seg" id="text-seg" role="group" aria-label="Text size">
          <button type="button" data-text="0.9">Small</button>
          <button type="button" data-text="1">Default</button>
          <button type="button" data-text="1.12">Large</button>
        </div>
      </div>
      <label class="set-row">
        <span class="set-label">Glow intensity</span>
        <input type="range" id="set-glow" min="0" max="200" value="100" />
      </label>
      <label class="set-row">
        <span class="set-label">Simulation pace</span>
        <input type="range" id="set-pace" min="30" max="300" value="100" />
      </label>
      <label class="set-row set-toggle">
        <span class="set-label">Reduce motion</span>
        <span class="toggle"><input type="checkbox" id="set-motion" /><i></i></span>
      </label>
      <!-- one machine per line. The two used to share a line joined by
           "&nbsp;·&nbsp;", which cannot fit 13px mono inside a 320px drawer:
           it wrapped mid-list and left the separator orphaned at the end of
           the line, so the note read as a broken sentence rather than as a
           two-entry list. -->
      <div class="drawer-note">
        Appearance only — the fleet keeps running.<br/>
        Machine A · 192.0.2.2<br/>
        Machine B · 192.0.2.1
      </div>
    </div>
    <a class="drawer-all" href="#/settings">all settings →</a>
  </aside>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
