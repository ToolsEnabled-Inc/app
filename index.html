<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Control</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='none' stroke='%2300a9d8' stroke-width='9'/><circle cx='50' cy='50' r='12' fill='%2300bd8a'/></svg>" />
</head>
<body>
  <!-- drifting neon auras the glass refracts -->
  <div class="aurora" aria-hidden="true">
    <i class="aur a1"></i><i class="aur a2"></i><i class="aur a3"></i><i class="aur a4"></i><i class="aur a5"></i><i class="aur a6"></i>
  </div>

  <header class="topbar">
    <div class="tb-side tb-left">
      <button class="icon-btn" id="nav-back" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="crumb" id="crumb"></div>
    </div>
    <nav class="tb-nav" id="tb-nav">
      <a href="#/" data-route="home">Home</a>
      <a href="#/computers" data-route="computers">Computers</a>
      <a href="#/metrics" data-route="metrics">Metrics</a>
      <a href="#/comms" data-route="comms">Comms</a>
    </nav>
    <div class="tb-side tb-right">
      <button class="icon-btn" id="open-settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.6a1.7 1.7 0 0 1 .34 1.87l-.55 1.28a1.7 1.7 0 0 1-1.63 1.03l-1.16-.05a6.6 6.6 0 0 1-1.11.65l-.38 1.1a1.7 1.7 0 0 1-1.6 1.14h-1.4a1.7 1.7 0 0 1-1.6-1.14l-.38-1.1a6.6 6.6 0 0 1-1.1-.65l-1.17.05a1.7 1.7 0 0 1-1.63-1.03l-.55-1.28a1.7 1.7 0 0 1 .34-1.87l.79-.85a6.7 6.7 0 0 1 0-1.5l-.79-.85a1.7 1.7 0 0 1-.34-1.87l.55-1.28A1.7 1.7 0 0 1 6.1 5.42l1.16.05a6.6 6.6 0 0 1 1.11-.65l.38-1.1A1.7 1.7 0 0 1 10.35 2.6h1.4a1.7 1.7 0 0 1 1.6 1.13l.38 1.1c.39.18.76.4 1.1.65l1.17-.05a1.7 1.7 0 0 1 1.63 1.03l.55 1.28a1.7 1.7 0 0 1-.34 1.87l-.79.85a6.7 6.7 0 0 1 0 1.5l.79.85Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="nav-next" title="Next" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="stage"></main>

  <!-- settings drawer (slides in, never a popup) -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span>Settings</span>
      <button class="icon-btn" id="close-settings" aria-label="Close settings">
        <svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <label class="set-row">
        <span class="set-label">Glow intensity</span>
        <input type="range" id="set-glow" min="0" max="200" value="100" />
      </label>
      <label class="set-row">
        <span class="set-label">Simulation pace</span>
        <input type="range" id="set-pace" min="30" max="300" value="100" />
      </label>
      <label class="set-row set-toggle">
        <span class="set-label">Reduce motion</span>
        <span class="toggle"><input type="checkbox" id="set-motion" /><i></i></span>
      </label>
      <div class="drawer-note">
        Appearance only — the fleet keeps running.<br/>
        Machine A · 192.168.214.2 &nbsp;·&nbsp; Machine B · 192.168.214.1
      </div>
    </div>
  </aside>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
